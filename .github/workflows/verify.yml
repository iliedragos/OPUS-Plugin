name: Verify OPUS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opus-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.suite }} (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [regression, endurance]
    env:
      FM_DX_WEBSERVER_DIR: ${{ github.workspace }}/.test-upstream
      UPSTREAM_REVISION: 447a4d618647ff4ddccdea241dffd301d3e384d4
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out upstream fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NoobishSVK/fm-dx-webserver
          ref: ${{ env.UPSTREAM_REVISION }}
          path: .test-upstream
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      # No npm install: these suites use only Node built-ins and the bundled decoder.
      # The upstream checkout is read as a fixture; its server is never started.
      - name: Validate prerequisites and record environment
        run: |
          mkdir -p test-results
          test "$(git -C "$FM_DX_WEBSERVER_DIR" rev-parse HEAD)" = "$UPSTREAM_REVISION"
          for file in 3las.formatreader.js 3las.liveaudioplayer.js 3las.fallback.js; do
            test -r "$FM_DX_WEBSERVER_DIR/web/js/3las/fallback/$file"
          done
          ffmpeg -hide_banner -encoders > test-results/ffmpeg-encoders.txt 2>&1
          grep -Eq '[[:space:]]libopus[[:space:]]' test-results/ffmpeg-encoders.txt
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const verification = require('./VERIFICATION.json');
          assert.equal(verification.upstreamFixtureCommit, process.env.UPSTREAM_REVISION);
          const runtimeFiles = (directory) => fs.readdirSync(directory, { withFileTypes: true })
            .flatMap((entry) => entry.isDirectory()
              ? runtimeFiles(`${directory}/${entry.name}`)
              : [`${directory}/${entry.name}`]);
          assert.deepEqual(Object.keys(verification.filesSha256).sort(), runtimeFiles('plugins').sort(),
            'Release fingerprint paths must exactly match all runtime files');
          for (const [file, expected] of Object.entries(verification.filesSha256)) {
            const actual = createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            assert.equal(actual, expected, `Release fingerprint mismatch: ${file}`);
          }
          console.log('Release runtime fingerprints match VERIFICATION.json');
          NODE
          find plugins -type f -print0 | sort -z | xargs -0 sha256sum > test-results/runtime.sha256
          {
            git rev-parse HEAD
            git -C "$FM_DX_WEBSERVER_DIR" rev-parse HEAD
            node --version
            npm --version
            ffmpeg -version
            uname -a
            cat /etc/os-release
            dpkg-query -W ffmpeg libopus0
            printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            sha256sum VERIFICATION.json
            cat test-results/runtime.sha256
          } | tee test-results/environment.txt

      - name: Repeat regression suite
        if: matrix.suite == 'regression'
        run: |
          for attempt in 1 2 3; do
            npm test 2>&1 | tee "test-results/regression-$attempt.log"
          done

      - name: Repeat simulated endurance suite
        if: matrix.suite == 'endurance'
        run: |
          for attempt in 1 2 3; do
            npm run test:endurance 2>&1 | tee "test-results/endurance-$attempt.log"
          done

      - name: Confirm runtime files stayed unchanged
        if: always()
        run: |
          if test -f test-results/runtime.sha256; then
            sha256sum --check test-results/runtime.sha256
            git diff --exit-code -- plugins VERIFICATION.json
          else
            echo 'Preflight did not produce a runtime fingerprint.' >&2
            exit 1
          fi

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  debian-compatibility:
    name: FFmpeg Debian 13 (Node 24)
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 15
    steps:
      - name: Install container prerequisites and FFmpeg with libopus
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git ffmpeg
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NoobishSVK/fm-dx-webserver
          ref: 447a4d618647ff4ddccdea241dffd301d3e384d4
          path: .test-upstream
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Record environment and repeat both suites
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          export FM_DX_WEBSERVER_DIR="$PWD/.test-upstream"
          git config --global --add safe.directory "$PWD"
          git config --global --add safe.directory "$FM_DX_WEBSERVER_DIR"
          test "$(git rev-parse --show-toplevel)" = "$PWD"
          test "$(git -C "$FM_DX_WEBSERVER_DIR" rev-parse HEAD)" = 447a4d618647ff4ddccdea241dffd301d3e384d4
          mkdir -p test-results
          git rev-parse HEAD > test-results/debian-source-commit.txt
          find plugins -type f -print0 | sort -z | xargs -0 sha256sum > test-results/debian-runtime.sha256
          node --version | tee test-results/debian-environment.txt
          ffmpeg -version | tee -a test-results/debian-environment.txt
          dpkg-query -W ffmpeg libopus0 | tee -a test-results/debian-environment.txt
          ffmpeg -hide_banner -encoders > test-results/debian-encoders.txt 2>&1
          grep -Eq '[[:space:]]libopus[[:space:]]' test-results/debian-encoders.txt
          for attempt in 1 2 3; do
            npm test 2>&1 | tee "test-results/debian-regression-$attempt.log"
            npm run test:endurance 2>&1 | tee "test-results/debian-endurance-$attempt.log"
          done
          sha256sum --check test-results/debian-runtime.sha256
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- plugins VERIFICATION.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-debian-compatibility
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
